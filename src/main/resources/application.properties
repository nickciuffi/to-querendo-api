spring.application.name=toQuerendo

server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/toQuerendo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:toQuerendo321@}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

spring.flyway.enabled=true
spring.flyway.locations=classpath:br/com/toquerendo/db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validateMigrationNaming=true
spring.flyway.out-of-order=true

security.jwt.secret=${JWT_SECRET:8f0e6f3f9c9e4b7dbb5f0f5f5f6e6a4b1c3d3e3f4a4b4c4d5e5f6061626364}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=none