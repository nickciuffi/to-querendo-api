services:
  postgres:
    image: postgres:17
    container_name: toQuerendo
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-toQuerendo}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-toQuerendo321@}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - toquerendo-net
    restart: unless-stopped

  app:
    build: .
    container_name: toquerendo-api
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-toQuerendo}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-toQuerendo321@}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      PORT: 8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xmx384m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC}
    networks:
      - toquerendo-net
    restart: unless-stopped

networks:
  toquerendo-net:
    driver: bridge

volumes:
  postgres_data: