services:
  postgres:
    image: postgres:17
    container_name: toQuerendo
    environment:
      POSTGRES_DB: toQuerendo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: toQuerendo321@
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: